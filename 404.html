<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1C1814">
<title>Page Not Found | Curated Travel by Crystal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF8F2; --espresso:#1C1814; --muted:#7A6F66;
    --gold:#B8965A; --gold-deep:#9A7B45;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Jost',system-ui,sans-serif;
    --script:'Pinyon Script',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--cream); color:var(--espresso); font-family:var(--sans);
    text-align:center; padding:32px;
  }
  .wrap{max-width:560px;}
  .eyebrow{font-family:var(--script); font-size:34px; color:var(--gold); margin-bottom:8px;}
  .code{font-family:var(--serif); font-size:clamp(72px,16vw,128px); font-weight:300; line-height:1; color:var(--gold-deep);}
  h1{font-family:var(--serif); font-weight:400; font-size:clamp(26px,5vw,40px); margin:12px 0 16px;}
  p{color:var(--muted); font-size:17px; line-height:1.6; margin-bottom:32px;}
  .btn{
    display:inline-block; font-family:var(--sans); font-weight:500; letter-spacing:.04em;
    text-decoration:none; color:var(--cream); background:var(--gold);
    padding:14px 34px; border-radius:2px; transition:background .3s ease;
  }
  .btn:hover{background:var(--gold-deep);}
</style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Off the map</div>
    <div class="code">404</div>
    <h1>This page wandered off</h1>
    <p>The page you're looking for isn't here — but your next journey still is. Let's get you back on course.</p>
    <a class="btn" href="/">Return Home</a>
  </main>
</body>
</html>
